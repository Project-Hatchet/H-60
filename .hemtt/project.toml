name = "Hatchet H-60 Pack"
prefix = "hct"
mainprefix = "z"

[properties]
author = "Project Hatchet"

[version]
# MAJOR/MINOR/PATCHLVL/BUILD are read from the main addon's script_version.hpp.
path = "addons/h60_main/script_version.hpp"
git_hash = 0

[files]
include = [
    "mod.cpp",
    "meta.cpp",
    "logo_vtx_ca.paa",
    "logo_vtx_small_ca.paa",
    "LICENSE",
    "README.md",
]
# HEMTT packs everything under addons/ unless excluded: source images, notes and
# generated texture headers stay out of the PBOs.
exclude = [
    "*.png",
    "*.tga",
    "*.md",
    "texHeaders.bin",
    # DEV ONLY - un-comment so -filePatching picks up loose .sqf edits (Arma prefers
    # a packed .sqfc). hooks/pre_release/guard_sqfc.rhai blocks a release while it is on.
    # "**/*.sqfc",
]

[hemtt.release]
sign = false
archive = true
