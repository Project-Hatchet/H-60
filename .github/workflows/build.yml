
name: Validate & Build

on:
  workflow_dispatch:
  push:
    branches:
    - Main
    - devbuild
  pull_request:

# When several commits land on the same PR in quick succession, only the
# latest build matters - cancel the superseded ones. The same goes for the
# devbuild branch: it is machine-generated (Main + labeled PRs, force-pushed
# on every label change), so labeling several PRs in a burst force-pushes it
# repeatedly and only the LAST regeneration's build is meaningful - without
# cancellation a 9-PR labeling session queues 9 full Windows builds, 8 of
# them stale before they start. Main push builds are never cancelled.
concurrency:
  group: validate-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/devbuild' }}

jobs:
  # validate:
  #   runs-on: ubuntu-latest
  #   steps:
  #   - name: Checkout the source code
  #     uses: actions/checkout@v2
  #   - name: Validate SQF
  #     run: python3 tools/sqf_validator.py
  #   - name: Validate Config
  #     run: python3 tools/config_style_checker.py
  #   - name: Validate Stringtables
  #     run: python3 tools/stringtable_validator.py
  #   - name: Validate Return Types
  #     run: python3 tools/return_checker.py
  #   - name: Check for BOM
  #     uses: arma-actions/bom-check@master
  build:
    # PRs from forks cannot build: the Arma 3 Tools download secret is
    # withheld from fork-triggered runs, so their build always fails at
    # setup. Skip instead of showing outside contributors a guaranteed
    # red X - fork PRs get built via the devbuild branch once labeled
    # "Ready for Testing".
    if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
    runs-on: windows-2022
    steps:
      - name: Checkout the source code
        uses: actions/checkout@v4.2.0
        with:
          fetch-depth: 1
      - name: Set up A3Tools
        uses: arma-actions/arma3-tools@master
        with:
          toolsUrl: ${{ secrets.A3TOOLS_S3_URL }}
      - name: Set up scons
        run: python -m pip install scons
      - name: Build with Scons
        run: scons
      - name: Upload Artifact
        uses: actions/upload-artifact@v4.4.0
        with:
          name: hatchet-${{ github.sha }}-nobin
          path: release

  # Phase 3 (HEMTT migration, WP4a): the HEMTT build runs beside the SCons build
  # until the equivalence proof and a tester wave have cleared it, then SCons
  # retires (WP4e). Needs no Arma 3 Tools and no secrets, so it also runs for
  # PRs from forks - the first CI signal outside contributors get.
  # Models are pre-binarized (ODOL) and HEMTT rapifies configs itself, hence
  # --no-bin. `hemtt check --pedantic` fails only on errors; the ~2,400 known
  # warnings (macro redefinitions in the MFD page headers, padded macro
  # arguments) are catalogued in docs/phase-3/proof/scouting.md and are
  # Phase 4 material.
  hemtt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the source code
        uses: actions/checkout@v4.2.0
        with:
          fetch-depth: 1
      - name: Set up HEMTT
        uses: arma-actions/hemtt@v1
        env:
          # the action downloads HEMTT through the GitHub API; authenticated
          # requests avoid the shared unauthenticated rate limit
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check
        run: hemtt check --pedantic
      - name: Build
        run: hemtt build --no-bin
      - name: Name the mod folder
        run: mv .hemttout/build .hemttout/@H-60
      - name: Upload Artifact
        uses: actions/upload-artifact@v4.4.0
        with:
          name: hatchet-${{ github.sha }}-hemtt
          path: .hemttout/@H-60
          retention-days: 14
          if-no-files-found: error
