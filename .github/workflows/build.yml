
name: Validate & Build

on:
  workflow_dispatch:
  push:
    branches:
    - Main
    - devbuild
  pull_request:

# When several commits land on the same PR in quick succession, only the
# latest build matters - cancel the superseded ones. The same goes for the
# devbuild branch: it is machine-generated (Main + labeled PRs, force-pushed
# on every label change), so labeling several PRs in a burst force-pushes it
# repeatedly and only the LAST regeneration's build is meaningful - without
# cancellation a 9-PR labeling session queues 9 full builds, 8 of them
# stale before they start. Main push builds are never cancelled.
concurrency:
  group: validate-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/devbuild' }}

jobs:
  # Structural checks a Linux runner can enforce - include case, empty files,
  # BOMs, PREP/file parity, addon layout and the HEMTT portability rules. SQF
  # syntax and lints are the hemtt job's business (hemtt check).
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout the source code
        uses: actions/checkout@v4.2.0
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate the tree
        run: python tools/validate_tree.py
      # A PR that changes addons/ must add a changelog fragment (changelog/README.md),
      # unless it is labeled "Release Notes: Ignore". The changed paths come from the
      # API (fetch-depth 1 has no merge base; fork PRs read fine with the default token).
      - name: Changelog fragment
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          # quoted: the label's ": " otherwise starts a YAML mapping and the whole workflow fails to load
          ALLOW: "${{ contains(github.event.pull_request.labels.*.name, 'Release Notes: Ignore') && '--allow' || '' }}"
        run: gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only | python tools/changelog.py check --changed-files - $ALLOW
  # The build. Needs no Arma 3 Tools and no secrets, so it also runs for PRs
  # from forks. Models are pre-binarized (ODOL) and HEMTT rapifies configs
  # itself, hence --no-bin. `hemtt check --pedantic` fails on errors only.
  hemtt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the source code
        uses: actions/checkout@v4.2.0
        with:
          fetch-depth: 1
      - name: Set up HEMTT
        uses: arma-actions/hemtt@v1
        env:
          # the action downloads HEMTT through the GitHub API; authenticated
          # requests avoid the shared unauthenticated rate limit
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check
        run: hemtt check --pedantic
      - name: Build
        run: hemtt build --no-bin
      - name: Name the mod folder
        run: mv .hemttout/build .hemttout/@H-60
      - name: Upload Artifact
        uses: actions/upload-artifact@v4.4.0
        with:
          name: hatchet-${{ github.sha }}-hemtt
          path: .hemttout/@H-60
          retention-days: 14
          if-no-files-found: error
